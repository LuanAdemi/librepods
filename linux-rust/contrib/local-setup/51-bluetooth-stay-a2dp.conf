# WirePlumber: keep Bluetooth headphones in high-quality A2DP (AAC) playback.
# Install to ~/.config/wireplumber/wireplumber.conf.d/ (install.sh does this and
# fills in your AirPods' address), then: systemctl --user restart wireplumber
#
# With LibrePods' hi-res mic (AirPodsHiRes) the AirPods' own headset mode (HFP)
# isn't needed for calls; it stays selectable by hand in the sound settings.

wireplumber.settings = {
  # Don't flip to headset mode when an app opens a microphone.
  bluetooth.autoswitch-to-headset-profile = false
}

monitor.bluez.rules = [
  {
    # Your AirPods: always come up in A2DP playback, not headset mode.
    # AIRPODS_MAC with underscores, e.g. bluez_card.AA_BB_CC_DD_EE_FF
    matches = [ { device.name = "bluez_card.AIRPODS_MAC" } ]
    actions = { update-props = { device.profile = "a2dp-sink" } }
  }
]
